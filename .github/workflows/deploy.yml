name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_INPUT: false
  TF_IN_AUTOMATION: true
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_database_allowed_cidr_blocks: ${{ vars.DATABASE_ALLOWED_CIDR_BLOCKS }}
  TF_VAR_twilio_account_sid: ${{ secrets.TWILIO_ACCOUNT_SID }}
  TF_VAR_twilio_auth_token: ${{ secrets.TWILIO_AUTH_TOKEN }}
  TF_VAR_twilio_verify_service_sid: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}

jobs:
  deploy:
    name: Apply Terraform and Deploy Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform format check
        working-directory: infra
        run: terraform fmt -recursive -check

      - name: Terraform init
        working-directory: infra/app
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        working-directory: infra/app
        run: terraform validate

      - name: Terraform apply
        working-directory: infra/app
        run: |
          if terraform state list | grep -q '^aws_apigatewayv2_authorizer\.api$'; then
            echo "Legacy API authorizer found in state. Applying route updates first to detach authorizer references."
            terraform apply -auto-approve -target=aws_apigatewayv2_route.api
          fi

          terraform apply -auto-approve

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read Terraform outputs
        id: terraform-outputs
        working-directory: infra/app
        run: |
          echo "site_bucket_name=$(terraform output -raw site_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ steps.terraform-outputs.outputs.api_url }}
          VITE_DEFAULT_COUNTRY: US
        run: npm run build

      - name: Sync site assets
        run: aws s3 sync dist "s3://${{ steps.terraform-outputs.outputs.site_bucket_name }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.terraform-outputs.outputs.cloudfront_distribution_id }}" \
            --paths "/*"
