name: iOS App Store Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ios-app-store-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and Submit iOS App
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      APP_IDENTIFIER: com.banbury.birthdays
      APP_REVIEW_DEMO_PASSWORD: ${{ secrets.APP_REVIEW_DEMO_PASSWORD }}
      APP_REVIEW_DEMO_USER: ${{ secrets.APP_REVIEW_DEMO_USER }}
      APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
      APP_REVIEW_FIRST_NAME: ${{ vars.APP_REVIEW_FIRST_NAME || 'Banbury' }}
      APP_REVIEW_LAST_NAME: ${{ vars.APP_REVIEW_LAST_NAME || 'Team' }}
      APP_REVIEW_NOTES: ${{ vars.APP_REVIEW_NOTES }}
      APP_REVIEW_PHONE_NUMBER: ${{ vars.APP_REVIEW_PHONE_NUMBER }}
      APP_STORE_APPLE_ID: ${{ vars.APP_STORE_APPLE_ID }}
      APP_STORE_COMPANY_NAME: ${{ vars.APP_STORE_COMPANY_NAME }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_CREATE_APP: ${{ vars.APP_STORE_CONNECT_CREATE_APP || 'false' }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_TEAM_ID: ${{ vars.APP_STORE_CONNECT_TEAM_ID }}
      APP_STORE_PRIMARY_LOCALE: ${{ vars.APP_STORE_PRIMARY_LOCALE || 'en-US' }}
      APP_STORE_SKU: ${{ vars.APP_STORE_SKU || 'birthdays-ios' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      FASTLANE_SKIP_SCREENSHOTS: ${{ vars.FASTLANE_SKIP_SCREENSHOTS || 'true' }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_GIT_BRANCH: ${{ vars.MATCH_GIT_BRANCH || 'main' }}
      MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ vars.IOS_PROVISIONING_PROFILE_SPECIFIER }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_DEFAULT_COUNTRY: ${{ vars.VITE_DEFAULT_COUNTRY || 'US' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Validate App Store Connect configuration
        run: |
          missing=()

          if [ -z "$APP_STORE_CONNECT_KEY_ID" ] && [ -z "$APP_STORE_CONNECT_API_KEY_KEY_ID" ]; then
            missing+=("APP_STORE_CONNECT_KEY_ID or APP_STORE_CONNECT_API_KEY_KEY_ID")
          fi

          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] && [ -z "$APP_STORE_CONNECT_API_KEY_ISSUER_ID" ]; then
            missing+=("APP_STORE_CONNECT_ISSUER_ID or APP_STORE_CONNECT_API_KEY_ISSUER_ID")
          fi

          if [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ] && [ -z "$APP_STORE_CONNECT_API_KEY_KEY" ]; then
            missing+=("APP_STORE_CONNECT_API_KEY_BASE64 or APP_STORE_CONNECT_API_KEY_KEY")
          fi

          if [ -z "$APPLE_TEAM_ID" ]; then
            missing+=("APPLE_TEAM_ID repository variable")
          fi

          if [ -z "$APP_REVIEW_EMAIL" ]; then
            missing+=("APP_REVIEW_EMAIL secret")
          fi

          if [ -z "$MATCH_GIT_URL" ] && [ -z "$IOS_PROVISIONING_PROFILE_SPECIFIER" ]; then
            missing+=("IOS_PROVISIONING_PROFILE_SPECIFIER repository variable (profile name) or MATCH_GIT_URL for fastlane match")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing iOS release configuration:\n'
            printf -- '- %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install manual signing assets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "Manual signing secrets are not set. Fastlane match will be used if MATCH_GIT_URL is configured."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILE_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          KEYCHAIN_PASSWORD="${IOS_KEYCHAIN_PASSWORD:-temporary-ci-keychain-password}"

          echo "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          TMP_PLIST=$(mktemp)
          security cms -D -i "$PROFILE_PATH" >"$TMP_PLIST" 2>/dev/null || {
            echo "Failed to decode provisioning profile (security cms)."
            exit 1
          }
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$TMP_PLIST" 2>/dev/null || true)
          rm -f "$TMP_PLIST"
          if [ -z "$PROFILE_UUID" ]; then
            echo "Could not read UUID from provisioning profile."
            exit 1
          fi
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

      - name: Build, upload, and submit for review
        working-directory: ios
        run: bundle exec fastlane ios release
