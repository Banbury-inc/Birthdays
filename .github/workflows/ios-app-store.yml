name: iOS App Store Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      initialize_signing:
        description: Allow fastlane match to create and commit initial signing assets
        required: false
        default: false
        type: boolean

concurrency:
  group: ios-app-store-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and Submit iOS App
    runs-on: macos-26
    timeout-minutes: 90

    env:
      APP_IDENTIFIER: com.banbury.birthdays
      APP_REVIEW_DEMO_PASSWORD: ${{ secrets.APP_REVIEW_DEMO_PASSWORD }}
      APP_REVIEW_DEMO_USER: ${{ secrets.APP_REVIEW_DEMO_USER }}
      APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
      APP_REVIEW_FIRST_NAME: ${{ vars.APP_REVIEW_FIRST_NAME || 'Banbury' }}
      APP_REVIEW_LAST_NAME: ${{ vars.APP_REVIEW_LAST_NAME || 'Team' }}
      APP_REVIEW_NOTES: ${{ vars.APP_REVIEW_NOTES }}
      APP_REVIEW_PHONE_NUMBER: ${{ vars.APP_REVIEW_PHONE_NUMBER }}
      APP_STORE_APPLE_ID: ${{ vars.APP_STORE_APPLE_ID }}
      APP_STORE_COMPANY_NAME: ${{ vars.APP_STORE_COMPANY_NAME }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_CREATE_APP: ${{ vars.APP_STORE_CONNECT_CREATE_APP || 'false' }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_TEAM_ID: ${{ vars.APP_STORE_CONNECT_TEAM_ID }}
      APP_STORE_PRIMARY_LOCALE: ${{ vars.APP_STORE_PRIMARY_LOCALE || 'en-US' }}
      APP_STORE_PRIVACY_POLICY_URL: ${{ vars.APP_STORE_PRIVACY_POLICY_URL }}
      APP_STORE_SKU: ${{ vars.APP_STORE_SKU || 'birthdays-ios' }}
      APP_STORE_SUPPORT_URL: ${{ vars.APP_STORE_SUPPORT_URL }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      FASTLANE_SKIP_SCREENSHOTS: ${{ vars.FASTLANE_SKIP_SCREENSHOTS || 'true' }}
      MATCH_GIT_BRANCH: ${{ vars.MATCH_GIT_BRANCH || 'main' }}
      MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_READONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.initialize_signing == 'true' && 'false' || 'true' }}
      IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ vars.IOS_PROVISIONING_PROFILE_SPECIFIER }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_DEFAULT_COUNTRY: ${{ vars.VITE_DEFAULT_COUNTRY || 'US' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # App Store Connect requires apps to be built with the iOS 26 SDK or later.
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Validate App Store Connect configuration
        run: |
          missing=()

          if [ -z "$APP_STORE_CONNECT_KEY_ID" ] && [ -z "$APP_STORE_CONNECT_API_KEY_KEY_ID" ]; then
            missing+=("APP_STORE_CONNECT_KEY_ID or APP_STORE_CONNECT_API_KEY_KEY_ID")
          fi

          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] && [ -z "$APP_STORE_CONNECT_API_KEY_ISSUER_ID" ]; then
            missing+=("APP_STORE_CONNECT_ISSUER_ID or APP_STORE_CONNECT_API_KEY_ISSUER_ID")
          fi

          if [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ] && [ -z "$APP_STORE_CONNECT_API_KEY_KEY" ]; then
            missing+=("APP_STORE_CONNECT_API_KEY_BASE64 or APP_STORE_CONNECT_API_KEY_KEY")
          fi

          if [ -z "$APPLE_TEAM_ID" ]; then
            missing+=("APPLE_TEAM_ID repository variable")
          fi

          if [ -z "$APP_REVIEW_EMAIL" ]; then
            missing+=("APP_REVIEW_EMAIL secret")
          fi

          if [ -z "$APP_REVIEW_PHONE_NUMBER" ]; then
            missing+=("APP_REVIEW_PHONE_NUMBER repository variable (include country code, for example +1 555 555 5555)")
          fi

          if [ -z "$MATCH_GIT_URL" ] && [ -z "$IOS_PROVISIONING_PROFILE_SPECIFIER" ]; then
            missing+=("IOS_PROVISIONING_PROFILE_SPECIFIER repository variable (profile name) or MATCH_GIT_URL for fastlane match")
          fi

          if [ -z "$APP_STORE_SUPPORT_URL" ]; then
            missing+=("APP_STORE_SUPPORT_URL repository variable (App Store support URL)")
          fi

          if [ -z "$APP_STORE_PRIVACY_POLICY_URL" ]; then
            missing+=("APP_STORE_PRIVACY_POLICY_URL repository variable (public privacy policy URL)")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing iOS release configuration:\n'
            printf -- '- %s\n' "${missing[@]}"
            exit 1
          fi

          KEY_ID="${APP_STORE_CONNECT_KEY_ID:-$APP_STORE_CONNECT_API_KEY_KEY_ID}"
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$KEY_DIR/AuthKey_${KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          if [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            if ! printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_FILE"; then
              echo "APP_STORE_CONNECT_API_KEY_BASE64 is not valid base64."
              rm -f "$KEY_FILE"
              exit 1
            fi
          else
            printf '%s\n' "$APP_STORE_CONNECT_API_KEY_KEY" > "$KEY_FILE"
          fi

          if ! openssl pkey -in "$KEY_FILE" -noout >/dev/null 2>&1; then
            echo "App Store Connect API key is not a valid .p8 private key."
            echo "Set APP_STORE_CONNECT_API_KEY_KEY to the raw contents of AuthKey_${KEY_ID}.p8 (preferred), or APP_STORE_CONNECT_API_KEY_BASE64 to its base64."
            rm -f "$KEY_FILE"
            exit 1
          fi

          chmod 600 "$KEY_FILE"
          printf 'API_PRIVATE_KEYS_DIR=%s\n' "$KEY_DIR" >> "$GITHUB_ENV"
          echo "Installed App Store Connect API key for Apple upload tools."

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install manual signing assets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            if [ -z "$MATCH_GIT_URL" ]; then
              echo "Manual signing requires IOS_DISTRIBUTION_CERTIFICATE_BASE64 and IOS_PROVISIONING_PROFILE_BASE64 secrets."
              exit 1
            fi

            echo "Manual signing secrets are not set. Fastlane match will be used if MATCH_GIT_URL is configured."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILE_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          KEYCHAIN_PASSWORD="${IOS_KEYCHAIN_PASSWORD:-temporary-ci-keychain-password}"

          echo "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          TMP_PLIST=$(mktemp)
          security cms -D -i "$PROFILE_PATH" >"$TMP_PLIST" 2>/dev/null || {
            echo "Failed to decode provisioning profile (security cms)."
            exit 1
          }
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$TMP_PLIST" 2>/dev/null || true)
          rm -f "$TMP_PLIST"
          if [ -z "$PROFILE_UUID" ]; then
            echo "Could not read UUID from provisioning profile."
            exit 1
          fi
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

      # Match clones MATCH_GIT_URL over HTTPS. Same-repo workflows can use GITHUB_TOKEN (no PAT).
      # Set secret MATCH_GIT_BASIC_AUTHORIZATION only when the certs repo is another private repo.
      - name: Configure Match git HTTPS auth
        if: ${{ env.MATCH_GIT_URL != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATCH_AUTH_OVERRIDE: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          if [ -n "$MATCH_AUTH_OVERRIDE" ]; then
            printf 'MATCH_GIT_BASIC_AUTHORIZATION=%s\n' "$MATCH_AUTH_OVERRIDE" >> "$GITHUB_ENV"
          else
            if [ -z "$GITHUB_TOKEN" ]; then
              echo "GITHUB_TOKEN is unavailable; cannot authenticate fastlane match git clone."
              exit 1
            fi
            encoded="$(printf '%s' "x-access-token:${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            printf 'MATCH_GIT_BASIC_AUTHORIZATION=%s\n' "$encoded" >> "$GITHUB_ENV"
          fi

      - name: Build, upload, and submit for review
        working-directory: ios
        run: bundle exec fastlane ios release
